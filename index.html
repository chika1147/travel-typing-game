<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Typing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🚂 Travel Typing Game</h1>
    <p>ひらがな・カタカナ・漢字を学年別にえらべる旅タイピングゲーム</p>
  </header>

  <main class="game-container">
    <!-- スタート画面 -->
    <section class="screen active" id="startScreen">
      <h2>スタート駅</h2>

      <img src="assets/img/冒険者の楽しい一日.png" alt="主人公キャラクター" class="character">

      <div class="select-box">
        <label for="categorySelect">問題のしゅるい</label>
        <select id="categorySelect">
          <option value="hiragana">ひらがな</option>
          <option value="katakana">カタカナ</option>
          <option value="kanji">漢字</option>
        </select>
      </div>

      <div class="select-box">
        <label for="gradeSelect">学年をえらぶ</label>
        <select id="gradeSelect">
          <option value="g1">小学1年</option>
          <option value="g2">小学2年</option>
          <option value="g3">小学3年</option>
          <option value="g4">小学4年</option>
          <option value="g5">小学5年</option>
          <option value="g6">小学6年</option>
          <option value="j1">中学1年</option>
          <option value="j2">中学2年</option>
          <option value="j3">中学3年</option>
        </select>
      </div>

      <button id="startButton">ゲームスタート</button>
    </section>

    <!-- タイピング画面 -->
    <section class="screen" id="typingScreen">
      <h2>タイピングの旅</h2>

      <!-- 旅マップ（電車が進む） -->
      <div class="travel-map">
        <div class="map-line"></div>
        <div class="train" id="train">🚂</div>
        <div class="stations" id="stations"></div>
      </div>

      <div class="status-box">
        <p>スコア: <span id="score">0</span></p>
        <p>コンボ: <span id="combo">0</span></p>
        <p>のこり: <span id="remaining">7</span></p>
        <p>しゅるい: <span id="currentCategoryLabel">ひらがな</span></p>
        <p>学年: <span id="currentGradeLabel">小学1年</span></p>
      </div>

      <div class="word-box">
        <p id="questionLabel">問題</p>
        <p id="targetWord">あさ</p>
      </div>

      <input type="text" id="typingInput" placeholder="ここに入力してね">
      <button id="checkButton">判定</button>

      <p id="resultText"></p>
    </section>

    <!-- 結果画面 -->
    <section class="screen" id="resultScreen">
      <h2>🎉 ゴール！</h2>
      <p class="goal-text" id="goalText"></p>
      <p class="final-score">あなたのスコア: <span id="finalScore">0</span></p>
      <p class="final-combo">最高コンボ: <span id="maxCombo">0</span></p>
      <button id="restartButton">もう一度あそぶ</button>
    </section>
  </main>

  <audio id="bgm" src="assets/audio/Ticket Polka.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
